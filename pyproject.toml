[build-system]
requires = ["hatchling==1.32.3", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "tomlkit==0.15.1", "trove-classifiers==2026.6.1.19"]
build-backend = "hatchling.build"

[project]
name = "veri-ufku"
version = "0.1.0"
description = "Yerel Linux veri bilimi masaüstü uygulaması"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "matplotlib==3.11.2",
    "polars==2.0.0",
    "pyarrow==26.0.0",
    "PySide6==6.11.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.0",
    "skops==0.16.0",
]

[project.scripts]
veri-ufku = "veri_ufku.app:main"

[project.optional-dependencies]
formats = ["fastavro==1.13.1", "pyreadstat==1.3.6"]
arrays = ["h5netcdf==1.8.1", "h5py==3.16.0", "pint==0.26.1", "xarray==2026.9.0", "zarr==3.4.1"]
geospatial = ["pyogrio==0.13.0", "pyproj==3.7.2", "rasterio==1.5.1", "shapely==2.2.0"]
audio = ["soundfile==0.13.1"]
graphs = ["networkx==3.7"]
statistics-advanced = ["statsmodels==0.15.0"]
privacy = ["cryptography==50.0.2", "keyring==25.7.0"]
neural = ["torch==2.13.0+cpu"]
bayes = ["pymc==5.28.5", "arviz==0.23.4", "numba==0.68.0", "h5netcdf==1.8.1"]
connectors = [
    "boto3==1.43.111",
    "duckdb==1.5.6",
    "keyring==25.7.0",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
]
audio-speech = [
    "vosk==0.3.45",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "hatchling==1.32.3",
    "pathspec==1.1.1",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
    "duckdb==1.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veri_ufku"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
ruff = { path = "tools/wheels/ruff-0.16.10-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
